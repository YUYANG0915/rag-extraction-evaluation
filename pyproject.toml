[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "not-every-leak-counts"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "matplotlib>=3.8", "pandas>=2.0", "sentence-transformers>=3.0", "torch>=2.4"]

[tool.setuptools.packages.find]
where = ["src"]
